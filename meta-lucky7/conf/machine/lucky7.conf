#@TYPE: Machine
#@NAME: Samsung Galaxy Watch 4/FE
#@DESCRIPTION: Machine configuration for the Samsung Galaxy Watch 4/FE

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
DEFAULTTUNE = "cortexa55"
require conf/machine/include/hybris-watch.inc

# Don't generate a sparse image.
# These watches do not have Fastboot, the entire partition must be flashed.
GENERATE_SPARSE_IMAGE = "false"

MACHINE_DISPLAY_ROUND = "true"
MACHINE_HAS_WLAN = "true"

PREFERRED_VERSION_android = "upsidedowncake"
PREFERRED_PROVIDER_virtual/kernel = "linux-lucky7"
PREFERRED_VERSION_linux = "5.15+tiramisu"

# Multilib hack to make 32-bit userspace work with 64-bit kernel.
# TODO: Replace with multiconf, it should be cleaner.
require conf/multilib.conf
MULTILIBS = "multilib:lib32"
DEFAULTTUNE:virtclass-multilib-lib32 = "armv7a-neon"

IMAGE_INSTALL += "sensorfw-hybris-hal-plugins android-tools android-system underclock msm-fb-refresher asteroid-compass"
